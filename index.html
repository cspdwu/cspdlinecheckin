<script>
    const LIFF_ID = '2008925313-hrsUUpmB';
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxbXjiAujMhBxviA2nkKeCnw0bweo6Me6uQLUqPLqYULYCs7-gTeePEbd_7NsAEBKjEFw/exec'; 
    
    async function main() {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) { liff.login(); return; }
        const profile = await liff.getProfile();
        
        // ยิงคำสั่งเดียวจบ
        const response = await fetch(`${SCRIPT_URL}?action=initApp&userId=${profile.userId}`);
        const result = await response.json();
        
        eventConfig = result.config;
        document.getElementById('loading-container').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');

        if (result.registered) {
            userData = result.userData;
            document.getElementById('checkinArea').classList.remove('hidden');
            document.getElementById('dispName').innerText = userData.fullName;
            
            // ตรวจสอบว่าทำเช็คอินหรือเช็คเอาท์
            currentAction = (result.eventRecord.checkin) ? 'checkout' : 'checkin';
            updateUIByAction();
        } else {
            document.getElementById('regForm').classList.remove('hidden');
        }
    }
    
    // ที่เหลือเหมือนเดิม... (แต่เปลี่ยน fetch ใน handleAction ให้ใช้ SCRIPT_URL ตรงๆ)
    main();
</script>
